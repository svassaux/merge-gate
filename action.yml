name: merge-gate
description: Keeps a finalized pull request in draft until its CI is green, Copilot (or the Lovable relay in its place) has reviewed it and no review thread is open.
inputs:
  token:
    description: A token of the repository owner (the GATE_TOKEN secret). GITHUB_TOKEN cannot draw a pull request back to draft.
    required: true
  first-review:
    description: "`gate`: the gate asks Copilot for the pull request's one review. `ruleset`: a repository ruleset asks for it; the gate asks itself when no review came after 5 minutes."
    default: gate
  copilot-effort:
    description: "Copilot's review effort, named on every request the gate makes: `lite` (GitHub's average, $0.25 a review), `balanced` ($1.50), `max` ($10) or `adaptive`. A request that names none pays the account's default, Balanced since 2026-09-28."
    default: lite
  required-checks:
    description: Checks that must be present and green on the head, comma-separated — the CI's aggregate job.
    default: ''
  ignore-checks:
    description: Checks the CI verdict leaves out, comma-separated.
    default: ''
  lovable-relay-url:
    description: The Lovable relay's address (the LOVABLE_RELAY_URL secret). With the token, the relay reviews whatever head Copilot cannot, and Copilot's paid overage is left alone. Never on a repository whose code must not leave it.
    default: ''
  lovable-relay-token:
    description: The relay's token for this caller (the LOVABLE_RELAY_TOKEN secret).
    default: ''
runs:
  using: node24
  main: dist/index.js
