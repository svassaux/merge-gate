# The merge gate: a finalized pull request stays in draft until its CI is green, Copilot has reviewed
# it and no review thread is open — and Copilot out of credits never blocks it. Contract, inputs and
# costs: https://github.com/svassaux/merge-gate
# Copy this file as .github/workflows/merge-gate.yml and adapt the marked line (# ADAPT) only. The job
# itself lives once in svassaux/merge-gate (.github/workflows/gate.yml); GitHub requires the triggers
# to stay here.
# `pull_request_target`, not `pull_request`: its runs belong to the default branch, like the CI-completion
# and sweep runs, so a pull request shows the gate once, as its `merge-gate` verdict, instead of also a
# check for every run. Safe: the gate never checks out the pull request's code.
name: merge-gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, unlabeled]
  workflow_run:
    # The repository's CI workflows. Not Copilot's: a run it triggers waits for an approval that never
    # comes (action_required), so the sweep below is what sees a review land.
    workflows: [CI] # ADAPT: the CI workflows' names
    types: [completed]
  schedule:
    # Wakes the gate while a pull request waits on what starts no run it can execute: Copilot's review,
    # or a deployment's commit status. The rest of the time the job is skipped, which costs nothing.
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number — empty for every pull request the gate keeps
        required: false

jobs:
  gate:
    uses: svassaux/merge-gate/.github/workflows/gate.yml@v1
    secrets:
      GATE_TOKEN: ${{ secrets.GATE_TOKEN }}
    # Only when the CI's aggregate job is not named `verify`:
    # with:
    #   required-checks: <its name>
